<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miss You & Love You A Lot</title>
    <style>
        /* Basic reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body and background styling */
        body {
            background: linear-gradient(45deg, #ff6b81, #ff4b61, #ff7f50);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            margin: 0;
            flex-direction: column;
            position: relative;
            background-image: url('cute_teddy_rabbit.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Centered container for the message */
        .message-container {
            text-align: center;
            animation: fadeIn 3s ease-in-out infinite alternate;
            position: relative;
            z-index: 2;
        }

        /* Styling the main message */
        .miss-you-message {
            font-size: 4rem;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 2px;
            animation: animateMessage 2s ease-in-out infinite alternate;
            text-shadow: 0 0 5px #fff, 0 0 10px #ff6b81, 0 0 15px #ff6b81;
        }

        /* Styling the personal message */
        .personal-message {
            font-size: 3rem;
            color: #fff;
            margin-top: 20px;
            font-weight: normal;
            text-shadow: 0 0 10px #fff, 0 0 30px #ff6b81;
        }

        /* Button styling */
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            z-index: 2;
        }

        button {
            background-color: #ff4b61;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #ff6b81;
        }

        /* Heart animation */
        .heart-animations {
            position: absolute;
            top: 10%;
            right: 10%;
            animation: heartMovement 10s infinite;
            pointer-events: none;
        }

        .heart {
            width: 50px;
            height: 50px;
            background-color: transparent;
            border: 3px solid white;
            border-radius: 50%;
            position: absolute;
            animation: heartBeat 2s ease-in-out infinite;
        }

        .heart:nth-child(1) {
            top: 0;
            left: 0;
            animation-delay: 0.5s;
        }

        .heart:nth-child(2) {
            top: 10%;
            left: 10%;
            animation-delay: 1.5s;
        }

        .heart:nth-child(3) {
            top: 20%;
            left: 5%;
            animation-delay: 2.5s;
        }

        /* Heartbeat animation */
        @keyframes heartBeat {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.8;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Keyframe for animating the message */
        @keyframes animateMessage {
            0% {
                transform: translateY(-20px);
                opacity: 0;
            }
            50% {
                transform: translateY(10px);
                opacity: 1;
            }
            100% {
                transform: translateY(-20px);
                opacity: 0;
            }
        }

        /* Fade-in effect for the whole container */
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* Animation for glowing text */
        @keyframes glowText {
            0% {
                text-shadow: 0 0 5px #ffffff, 0 0 10px #ff6b81, 0 0 15px #ff6b81;
            }
            50% {
                text-shadow: 0 0 10px #ff6b81, 0 0 20px #ff6b81, 0 0 30px #ff6b81;
            }
            100% {
                text-shadow: 0 0 5px #ffffff, 0 0 10px #ff6b81, 0 0 15px #ff6b81;
            }
        }
    </style>
</head>
<body>

    <div class="message-container" id="messageContainer">
        <h1 class="miss-you-message" id="messageText">Welcome!</h1>
        <h2 class="personal-message" id="personalMessage"></h2>
    </div>

    <div class="buttons">
        <button id="showMessageButton">Show Messages</button>
        <button id="changeMessageButton">Change Message</button>
        <button id="changeAnimationButton">Change Animation</button>
    </div>

    <div class="heart-animations">
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
    </div>

    <script>
        // Selecting elements from the DOM
        const showMessageButton = document.getElementById("showMessageButton");
        const changeMessageButton = document.getElementById("changeMessageButton");
        const changeAnimationButton = document.getElementById("changeAnimationButton");
        const messageText = document.getElementById("messageText");
        const personalMessage = document.getElementById("personalMessage");

        // Initial message states
        let messageState = 0; // 0 for "I Miss You A Lot", 1 for "Love You A Lot"
        let messageContent = [
            "I Miss You A Lot",
            "Love You A Lot",
            "Mero Motu, I can't stop thinking about you!",
            "I Miss You, My Heart Beats for You!",
            "Love You A Lot, My One and Only!"
        ];

        // Function to show a random message from the list
        function showMessage() {
            const randomMessage = messageContent[Math.floor(Math.random() * messageContent.length)];
            messageText.textContent = randomMessage;
            messageText.style.animation = "glowText 2s ease-in-out infinite alternate";

            // Personal message for "Mero Motu"
            personalMessage.textContent = "Always here for you, Mero Motu!";
        }

        // Function to change message after 3 seconds
        function changeMessage() {
            setTimeout(() => {
                showMessage(); // Update message
            }, 3000);
        }

        // Function to change animation of the message
        function changeAnimation() {
            messageText.style.animation = "animateMessage 2s ease-in-out infinite alternate"; // Reset animation
        }

        // Event listeners for buttons
        showMessageButton.addEventListener("click", showMessage);
        changeMessageButton.addEventListener("click", changeMessage);
        changeAnimationButton.addEventListener("click", changeAnimation);
    </script>
</body>
</html>
